<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fake News Detector</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>📰 Fake News Detector</h1>

        <p class="subtitle">
            AI-powered Fake News Detection System
        </p>

        <form action="/predict" method="POST">

            <textarea
                name="news"
                placeholder="Paste your news article here..."
                required
            >{{ news if news else '' }}</textarea>

            <button type="submit">
                CHECK NEWS
            </button>

        </form>

        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        {% if prediction %}

        <div class="result">

            <h2>{{ prediction }}</h2>

            <p>
                Prediction Probability:
                <strong>{{ probability }}%</strong>
            </p>

            <p>
                {{ confidence }}
            </p>

            <small>
                Note: This is an ML-based prediction and not a factual verification.
            </small>

        </div>

        {% endif %}

    </div>

</body>

</html>
